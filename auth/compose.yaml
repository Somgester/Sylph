name: sylph-auth

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    entrypoint: ["/bin/bash", "/opt/keycloak/sylph-start.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-sylph-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set a strong admin password in auth/.env}
      KC_HOSTNAME: http://localhost:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./sylph-realm.json:/opt/keycloak/data/import/sylph-realm.json:ro
      - ./start-keycloak.sh:/opt/keycloak/sylph-start.sh:ro
    healthcheck:
      # The official image has Bash but no curl; probe the imported realm directly.
      test:
        - CMD
        - bash
        - -ec
        - >-
          { printf 'HEAD /realms/sylph/.well-known/openid-configuration HTTP/1.0\r\n\r\n' >&0;
          grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/8080
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 30

volumes:
  keycloak-data:
