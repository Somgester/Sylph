plugins {
    id 'application'
    id 'checkstyle'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
    // TM4E publishes stable jars in its Eclipse update site, without Maven metadata.
    exclusiveContent {
        forRepository {
            ivy {
                name = 'tm4eRelease'
                url = uri('https://download.eclipse.org/tm4e/releases/0.18.0/plugins')
                patternLayout {
                    artifact '[artifact]_[revision].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModule('org.eclipse', 'org.eclipse.tm4e.core')
        }
    }
}

dependencies {
    implementation libs.commonmark
    implementation libs.jsoup
    implementation libs.gson
    implementation libs.lsp4j
    implementation libs.nimbus.jose.jwt
    // Nimbus Ed25519 verification uses its optional Tink dependency.
    runtimeOnly libs.tink
    implementation libs.commonmark.tables
    implementation libs.commonmark.strikethrough
    runtimeOnly libs.slf4j.jdk14
    implementation libs.pty4j
    implementation libs.richtextfx
    implementation libs.tm4e.core
    // The update-site artifact has no transitive dependency metadata.
    runtimeOnly libs.bundles.tm4e.runtime
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.monocle
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
}

javafx {
    version = "21.0.2"
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.web']
}

application {
    mainClass = 'dev.somgester.sylph.App'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Keep real JavaFX scene/dialog checks off the desktop unless explicitly requested.
    if (!providers.gradleProperty('showUiTests').map { it.toBoolean() }.getOrElse(false)) {
        systemProperty 'glass.platform', 'Monocle'
        systemProperty 'monocle.platform', 'Headless'
        systemProperty 'prism.order', 'sw'
        systemProperty 'java.awt.headless', 'true'
    }
}


tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'pythonServer', 'authServer'
    }
}

tasks.register('authServerIntegrationTest', Test) {
    description = 'Verifies browser-style login against an explicitly configured local Keycloak server.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'authServer'
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('pythonServerIntegrationTest', Test) {
    description = 'Verifies Python support against an explicitly supplied Pyright executable.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'pythonServer'
    }
    systemProperty 'sylph.pythonServerExecutable', providers.gradleProperty('pythonServerExecutable').getOrElse('')
    shouldRunAfter tasks.named('test')
}

tasks.register('herdrFrameExperiment', JavaExec) {
    group = 'verification'
    description = 'Runs the opt-in JavaFX frame transport experiment.'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    workingDir = rootProject.file('experiments/herdr-embedding')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = rootProject.file('experiments/herdr-embedding/FrameBridgeDemo.java').absolutePath
    def gpuiHelper = providers.gradleProperty('herdrFrameHelper')
    if (gpuiHelper.isPresent()) {
        systemProperty 'sylph.herdr.frameHelper', rootProject.file(gpuiHelper.get()).absolutePath
    }
    def desktop = providers.gradleProperty('herdrDesktopExecutable')
    if (desktop.isPresent()) {
        systemProperty 'sylph.herdr.desktop', rootProject.file(desktop.get()).absolutePath
    }
    def desktopClicks = providers.gradleProperty('herdrDesktopClickProbe').isPresent()
    if (desktopClicks) {
        if (!desktop.isPresent() || providers.gradleProperty('herdrCoreExecutable').isPresent()
                || providers.gradleProperty('herdrTerminal').isPresent()) {
            throw new GradleException('Desktop click mode requires herdrDesktopExecutable without a fixed keyboard target.')
        }
        systemProperty 'sylph.herdr.desktopClicks', 'true'
    }
    def core = providers.gradleProperty('herdrCoreExecutable')
    def terminal = providers.gradleProperty('herdrTerminal')
    if (core.isPresent() || terminal.isPresent()) {
        if (!desktop.isPresent() || !core.isPresent() || !terminal.isPresent()) {
            throw new GradleException('Desktop keyboard input requires herdrDesktopExecutable, herdrCoreExecutable and herdrTerminal.')
        }
        systemProperty 'sylph.herdr.core', rootProject.file(core.get()).absolutePath
        systemProperty 'sylph.herdr.terminal', terminal.get()
    }
    def scrollSmoke = providers.gradleProperty('headlessHerdrScrollExperiment').isPresent()
    def clickSmoke = providers.gradleProperty('headlessGpuiClickExperiment').isPresent()
    def desktopClickSmoke = providers.gradleProperty('headlessHerdrDesktopClick')
    def nativeInputSmoke = providers.gradleProperty('headlessHerdrNativeInputExperiment').isPresent()
    def clipboardSmoke = providers.gradleProperty('headlessHerdrClipboardExperiment').isPresent()
    if (clipboardSmoke && (!desktopClicks || desktopClickSmoke.isPresent())) {
        throw new GradleException('The clipboard smoke test needs a patched Desktop preview with a preselected terminal.')
    }
    if (nativeInputSmoke && !desktopClickSmoke.isPresent()) {
        throw new GradleException('The native input smoke test needs headlessHerdrDesktopClick coordinates.')
    }
    if (desktopClickSmoke.isPresent() && !desktopClicks) {
        throw new GradleException('The Desktop click smoke test requires herdrDesktopClickProbe.')
    }
    if (scrollSmoke && (!desktop.isPresent() || !core.isPresent() || !terminal.isPresent())) {
        throw new GradleException('The scroll smoke test requires a Desktop preview with a terminal target.')
    }
    if (clickSmoke && (!gpuiHelper.isPresent() || desktop.isPresent())) {
        throw new GradleException('The GPUI click smoke test requires herdrFrameHelper and no Desktop executable.')
    }
    if (clipboardSmoke || desktopClickSmoke.isPresent() || clickSmoke || scrollSmoke
            || providers.gradleProperty('headlessHerdrExperiment').isPresent()) {
        systemProperty 'glass.platform', 'Monocle'
        systemProperty 'monocle.platform', 'Headless'
        systemProperty 'prism.order', 'sw'
        args '--smoke'
        if (scrollSmoke) {
            args '--scroll-smoke'
        }
        if (clickSmoke) {
            args '--click-smoke'
        }
        if (desktopClickSmoke.isPresent()) {
            systemProperty 'sylph.herdr.desktopSmokeClick', desktopClickSmoke.get()
        }
        if (nativeInputSmoke) {
            args '--native-input-smoke'
        }
        if (clipboardSmoke) {
            args '--clipboard-smoke'
        }
    }
}
