plugins {
    id 'application'
    id 'checkstyle'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
    // TM4E publishes stable jars in its Eclipse update site, without Maven metadata.
    exclusiveContent {
        forRepository {
            ivy {
                name = 'tm4eRelease'
                url = uri('https://download.eclipse.org/tm4e/releases/0.18.0/plugins')
                patternLayout {
                    artifact '[artifact]_[revision].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModule('org.eclipse', 'org.eclipse.tm4e.core')
        }
    }
}

dependencies {
    implementation libs.commonmark
    implementation libs.jsoup
    implementation libs.gson
    implementation libs.lsp4j
    implementation libs.nimbus.jose.jwt
    // Nimbus Ed25519 verification uses its optional Tink dependency.
    runtimeOnly libs.tink
    implementation libs.commonmark.tables
    implementation libs.commonmark.strikethrough
    runtimeOnly libs.slf4j.jdk14
    implementation libs.pty4j
    implementation libs.richtextfx
    implementation libs.tm4e.core
    // The update-site artifact has no transitive dependency metadata.
    runtimeOnly libs.bundles.tm4e.runtime
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.monocle
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
}

javafx {
    version = "21.0.2"
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.web']
}

application {
    mainClass = 'dev.somgester.sylph.App'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Keep real JavaFX scene/dialog checks off the desktop unless explicitly requested.
    if (!providers.gradleProperty('showUiTests').map { it.toBoolean() }.getOrElse(false)) {
        systemProperty 'glass.platform', 'Monocle'
        systemProperty 'monocle.platform', 'Headless'
        systemProperty 'prism.order', 'sw'
        systemProperty 'java.awt.headless', 'true'
    }
}


tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'pythonServer', 'authServer'
    }
}

tasks.register('authServerIntegrationTest', Test) {
    description = 'Verifies browser-style login against an explicitly configured local Keycloak server.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'authServer'
    }
    shouldRunAfter tasks.named('test')
}

tasks.register('pythonServerIntegrationTest', Test) {
    description = 'Verifies Python support against an explicitly supplied Pyright executable.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'pythonServer'
    }
    systemProperty 'sylph.pythonServerExecutable', providers.gradleProperty('pythonServerExecutable').getOrElse('')
    shouldRunAfter tasks.named('test')
}
